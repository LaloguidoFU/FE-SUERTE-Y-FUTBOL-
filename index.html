<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiniela Pro</title>
    <style>
        :root { --primary: #1e3a8a; --primary-light: #3b82f6; --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; --green: #22c55e; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        
        header { text-align: center; margin-bottom: 20px; padding: 15px; background: var(--primary); color: white; border-radius: 12px; }
        .reglas { background: #ffffff; padding: 15px; border-radius: 12px; border: 2px solid var(--primary); margin: 15px 0; text-align: left; color: #334155; font-size: 13px; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #cbd5e1; font-size: 12px; }
        .tab-btn.active { background: var(--primary-light); color: white; }

        .panel { display: none; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .panel.active { display: block; }

        .match-card { display: flex; flex-direction: column; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; background: #fafafa; }
        .teams-row { width: 100%; display: flex; justify-content: space-between; font-weight: bold; font-size: 12px; margin-bottom: 5px; }
        .options-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        
        .btn-radio { appearance: none; padding: 4px 8px; background: #e2e8f0; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-radio:checked { background: var(--primary); color: white; }
        .btn-radio::before { content: attr(data-label); }

        .advance-select { width: 100%; padding: 5px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px; }
        .submit-btn { width: 100%; padding: 10px; background: var(--green); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        table { width: 100%; font-size: 12px; border-collapse: collapse; }
        th, td { padding: 8px 2px; text-align: center; border-bottom: 1px solid var(--border); }
        
        .btn-secondary { padding: 4px 8px; background: #64748b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .detail-box { background: #f1f5f9; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏆 Quiniela Pro</h1>
        <div class="reglas">
            <strong>📜 Reglas:</strong>

    <div class="tabs">

    <div id="panel-tabla" class="panel active">

        <div id="user-details-section" style="margin-top: 15px; display: none;">
            <h3 style="font-size: 14px;">Pronósticos de: <span id="detail-user-name"></span></h3>
            <div id="details-space" class="detail-box"></div>
        </div>
    </div>

    <div id="panel-registro" class="panel">
        <input type="text" id="player-name" placeholder="Tu nombre..." style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:6px;">
        <div id="matches-form-container"></div>
        <button class="submit-btn" onclick="savePrediction()">Enviar por WhatsApp</button>
    </div>

    <div id="panel-admin" class="panel">
        <input type="password" id="admin-pass" placeholder="Contraseña..." style="width:100%; padding:8px; margin-bottom:10px;">
        <button class="btn-secondary" onclick="verifyAdmin()">Verificar</button>
        <div id="admin-content" style="display:none; margin-top:15px;">

    </div>
</div>
