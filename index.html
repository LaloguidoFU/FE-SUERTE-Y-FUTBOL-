<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela: Tablero de Resultados</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e3a8a; }
        .q-box { margin-bottom: 20px; padding: 15px; border-bottom: 1px solid #eee; }
        
        /* Tabla con scroll horizontal porque son muchas preguntas */
        .table-wrapper { overflow-x: auto; margin-top: 40px; }
        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #1e3a8a; color: white; }
        
        .acierto { background-color: #86efac; color: #065f46; font-weight: bold; }
        .fallo { background-color: #fca5a5; color: #991b1b; }
        
        .points-col { font-weight: bold; background: #fef08a; }
        
        button { width: 100%; padding: 20px; font-size: 18px; background: #1e3a8a; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 Gestión de Quiniela</h2>

    <!-- Sección 1: Formulario -->
    <div id="form-section">
        <h3>Registrar Participante</h3>
        <input type="text" id="username" placeholder="Nombre" style="width:100%; padding:10px; margin-bottom:10px;">
        <div id="form-container"></div>
        <button onclick="generarEnlace()">Generar Enlace para WhatsApp</button>
    </div>

    <!-- Sección 2: Tabla de Resultados -->
    <div class="table-wrapper">
        <h3>Tabla de Posiciones</h3>
        <table id="results-table">
            <thead><tr id="header-row"></tr></thead>
            <tbody id="body-rows"></tbody>
        </table>
    </div>
</div>

<script>
/* 1. CONFIGURACIÓN: Aquí llenas los resultados reales según avancen los partidos */
const resultadosReales = {
    "q1": "Francia", "q2": "2-1", "q3": "Si" // ... completa con los resultados oficiales
};

/* 2. BASE DE DATOS: Aquí cargas los datos de los participantes */
const baseDeDatos = [
    { name: "Arellano", answers: {"q1": "Francia", "q2": "2-1", "q3": "Si"} },
    {
  "name": "Prueba 1",
  "answers": {
    "q1": "Empate",
    "q2": "1-1",
    "q3": "No",
    "q4": "España",
    "q5": "1-0",
    "q6": "No",
    "q7": "Noruega",
    "q8": "1-2",
    "q9": "No",
    "q10": "Si",
    "q11": "Argentina",
    "q12": "2-0",
    "q13": "Si",
    "q14": "Marruecos",
    "q15": "España",
    "q16": "Noruega",
    "q17": "Argentina",
    "q18": "Marruecos vs España",
    "q19": "Inglaterra vs Argentina",
    "q20": "Marruecos",
    "q21": "Noruega",
    "q22": "Marruecos vs Noruega",
    "q23": "España",
    "q24": "Argentina",
    "q25": "España vs Argentina",
    "q26": "Marruecos",
    "q27": "Inglaterra",
    "q28": "Noruega",
    "q29": "Otro"
  }
}

];

const qList = [
    {id: 1, label: "Fr/Mar"}, {id: 2, label: "M.Fr-Mar"}, {id: 3, label: "Mbappe"},
    {id: 4, label: "Esp/Bel"}, {id: 5, label: "M.Esp-Bel"}, {id: 6, label: "Yamal"},
    {id: 7, label: "Ing/Nor"}, {id: 8, label: "M.Ing-Nor"}, {id: 9, label: "Kane"},
    {id: 10, label: "Haland"}, {id: 11, label: "Arg/Sui"}, {id: 12, label: "M.Arg-Sui"},
    {id: 13, label: "Messi"}, {id: 14, label: "1.Semi"}, {id: 15, label: "2.Semi"},
    {id: 16, label: "3.Semi"}, {id: 17, label: "4.Semi"}, {id: 18, label: "P1.Semi"},
    {id: 19, label: "P2.Semi"}, {id: 20, label: "F1"}, {id: 21, label: "F2"},
    {id: 22, label: "Final"}, {id: 23, label: "3L1"}, {id: 24, label: "3L2"},
    {id: 25, label: "3erL"}, {id: 26, label: "Cam"}, {id: 27, label: "Sub"},
    {id: 28, label: "3er"}, {id: 29, label: "Gol"}
];

// Generar Formulario
const container = document.getElementById('form-container');
qList.forEach(q => {
    container.innerHTML += `<div class="q-box"><label>${q.id}. ${q.label}</label></div>`;
});

// Renderizar Tabla
function renderTable() {
    const headerRow = document.getElementById('header-row');
    const bodyRows = document.getElementById('body-rows');
    
    // Header
    headerRow.innerHTML = '<th>Participante</th><th class="points-col">PTS</th>';
    qList.forEach(q => headerRow.innerHTML += `<th>${q.id}</th>`);
    
    // Filas
    bodyRows.innerHTML = '';
    baseDeDatos.forEach(p => {
        let row = `<tr><td>${p.name}</td>`;
        let puntos = 0;
        let celdas = '';
        
        qList.forEach(q => {
            let val = p.answers['q'+q.id] || '-';
            let real = resultadosReales['q'+q.id];
            
            // Lógica de color y puntos
            let clase = '';
            if (real) {
                if (val === real) { clase = 'acierto'; puntos++; }
                else { clase = 'fallo'; }
            }
            celdas += `<td class="${clase}">${val}</td>`;
        });
        
        row += `<td class="points-col">${puntos}</td>${celdas}</tr>`;
        bodyRows.innerHTML += row;
    });
}

function generarEnlace() { alert("Lógica de generación vinculada al formulario anterior"); }

renderTable();
</script>
</body>
</html>
