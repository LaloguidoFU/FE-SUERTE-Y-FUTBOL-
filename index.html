<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Final - Sistema Completo</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; font-size: 16px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e3a8a; }
        
        .q-box { margin-bottom: 20px; padding: 10px; border-bottom: 1px solid #eee; }
        label { font-size: 16px; font-weight: 600; display: block; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        .score-row { display: flex; gap: 5px; align-items: center; }
        .score-input { width: 40px; padding: 8px; text-align: center; border-radius: 5px; border: 1px solid #ccc; }
        
        .table-wrapper { overflow-x: auto; margin-top: 40px; }
        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; min-width: 50px; }
        th { background: #1e3a8a; color: white; }
        
        .acierto { background-color: #86efac; color: #065f46; font-weight: bold; }
        .fallo { background-color: #fca5a5; color: #991b1b; }
        .points-col { font-weight: bold; background: #fef08a; }
        .btn-main { width: 100%; padding: 20px; font-size: 18px; background: #1e3a8a; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 Quiniela: Registro y Marcador</h2>
    
    <div id="form-container"></div>
    <input type="text" id="username" placeholder="Nombre del participante" style="width:100%; padding:15px; margin-bottom:20px; border-radius:10px; border: 1px solid #ccc;">
    <button class="btn-main" onclick="enviarValidado()">Generar WhatsApp</button>

    <div class="table-wrapper">
        <h3>📊 Tabla de Resultados</h3>
        <table id="results-table">
            <thead><tr id="header-row"></tr></thead>
            <tbody id="body-rows"></tbody>
        </table>
    </div>
</div>

<script>
/* 1. CONFIGURACIÓN: Resultados Reales (Llena esto cuando ocurran los partidos) */
const resultadosReales = {
    // Ejemplo: "q1": "Francia", "q2": "2-1"
};

/* 2. BASE DE DATOS: Participantes (Agrega aquí manualmente a los que te escriban) */
const baseDeDatos = [
    { name: "Arellano", answers: {} }, // Llena sus respuestas aquí
    { name: "Prueba 1", answers: {} }
];

const qList = [
    {id: 1, label: "Francia vs Marruecos", type: "select", opts: ["Francia", "Empate", "Marruecos"]},
    {id: 2, label: "Marcador Fr-Mar", type: "score"},
    {id: 3, label: "Mbappe Anotará", type: "select", opts: ["Si", "No"]},
    {id: 4, label: "España vs Belgica", type: "select", opts: ["España", "Empate", "Belgica"]},
    {id: 5, label: "Marcador Esp-Bel", type: "score"},
    {id: 6, label: "Yamal Anotará", type: "select", opts: ["Si", "No"]},
    {id: 7, label: "Inglaterra vs Noruega", type: "select", opts: ["Inglaterra", "Empate", "Noruega"]},
    {id: 8, label: "Marcador Ing-Nor", type: "score"},
    {id: 9, label: "Kane Anotará", type: "select", opts: ["Si", "No"]},
    {id: 10, label: "Haland Anotará", type: "select", opts: ["Si", "No"]},
    {id: 11, label: "Argentina vs Suiza", type: "select", opts: ["Argentina", "Empate", "Suiza"]},
    {id: 12, label: "Marcador Arg-Sui", type: "score"},
    {id: 13, label: "Messi Anotará", type: "select", opts: ["Si", "No"]},
    {id: 14, label: "1er equipo que avanza (Semi)", type: "select", opts: ["Francia", "Marruecos"]},
    {id: 15, label: "2do equipo que avanza (Semi)", type: "select", opts: ["España", "Belgica"]},
    {id: 16, label: "3er equipo que avanza (Semi)", type: "select", opts: ["Inglaterra", "Noruega"]},
    {id: 17, label: "4to equipo que avanza (Semi)", type: "select", opts: ["Argentina", "Suiza"]},
    {id: 18, label: "Partido 1ra Semifinal", type: "select", opts: ["Francia vs Belgica", "Francia vs España", "Marruecos vs España", "Marruecos vs Belgica"]},
    {id: 19, label: "Partido 2da Semifinal", type: "select", opts: ["Inglaterra vs Argentina", "Inglaterra vs Suiza", "Noruega vs Argentina", "Noruega vs Suiza"]},
    {id: 20, label: "1er Finalista", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica"]},
    {id: 21, label: "2do Finalista", type: "select", opts: ["Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 22, label: "Partido Final", type: "select", opts: ["Francia vs Noruega", "Francia vs Inglaterra", "Francia vs Argentina", "Francia vs Suiza", "España vs Noruega", "España vs Inglaterra", "España vs Argentina", "España vs Suiza", "Marruecos vs Noruega", "Marruecos vs Inglaterra", "Marruecos vs Argentina", "Marruecos vs Suiza", "Belgica vs Noruega", "Belgica vs Inglaterra", "Belgica vs Argentina", "Belgica vs Suiza"]},
    {id: 23, label: "1er Tercer Lugar", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica"]},
    {id: 24, label: "2do Tercer Lugar", type: "select", opts: ["Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 25, label: "Partido 3er Lugar", type: "select", opts: ["Francia vs Noruega", "Francia vs Inglaterra", "Francia vs Argentina", "Francia vs Suiza", "España vs Noruega", "España vs Inglaterra", "España vs Argentina", "España vs Suiza", "Marruecos vs Noruega", "Marruecos vs Inglaterra", "Marruecos vs Argentina", "Marruecos vs Suiza", "Belgica vs Noruega", "Belgica vs Inglaterra", "Belgica vs Argentina", "Belgica vs Suiza"]},
    {id: 26, label: "Campeón del mundial", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 27, label: "Sub-campeón", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 28, label: "Tercer lugar", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 29, label: "Máximo goleador", type: "select", opts: ["Lionel Messi", "Mbappe", "Haaland", "Harry Kane", "Dembele", "Oyarzabal", "Otro"]}
];

// Generar Formulario
const container = document.getElementById('form-container');
qList.forEach(q => {
    let html = `<div class="q-box"><label>${q.id}. ${q.label}</label>`;
    if (q.type === 'score') {
        html += `<div class="score-row"><input type="number" id="q${q.id}_h" class="score-input" placeholder="0"><span>-</span><input type="number" id="q${q.id}_a" class="score-input" placeholder="0"></div>`;
    } else {
        html += `<select id="q${q.id}"><option value="">Selecciona...</option>${q.opts.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
    }
    container.innerHTML += html + `</div>`;
});

// Renderizar Tabla
function renderTable() {
    const headerRow = document.getElementById('header-row');
    const bodyRows = document.getElementById('body-rows');
    headerRow.innerHTML = '<th>Participante</th><th class="points-col">PTS</th>';
    qList.forEach(q => headerRow.innerHTML += `<th>${q.id}</th>`);
    
    baseDeDatos.forEach(p => {
        let row = `<tr><td>${p.name}</td>`;
        let puntos = 0;
        let celdas = '';
        qList.forEach(q => {
            let val = p.answers['q'+q.id] || '-';
            let real = resultadosReales['q'+q.id];
            let clase = '';
            if (real) {
                if (val === real) { clase = 'acierto'; puntos++; }
                else { clase = 'fallo'; }
            }
            celdas += `<td class="${clase}">${val}</td>`;
        });
        row += `<td class="points-col">${puntos}</td>${celdas}</tr>`;
        bodyRows.innerHTML += row;
    });
}

function enviarValidado() {
    alert("Revisa la consola (F12) o implementa tu lógica de envío aquí.");
}

renderTable();
</script>
</body>
</html>
