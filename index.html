<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiniela Pro - Dieciseisavos</title>
    <style>
        :root { --primary: #1e3a8a; --primary-light: #3b82f6; --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; --green: #22c55e; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        header { text-align: center; margin-bottom: 20px; padding: 15px; background: var(--primary); color: white; border-radius: 12px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #cbd5e1; font-size: 12px; }
        .tab-btn.active { background: var(--primary-light); color: white; }
        .panel { display: none; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .panel.active { display: block; }
        .match-card { display: flex; flex-direction: column; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: #fafafa; }
        .teams-row { width: 100%; display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
        .btn-radio { appearance: none; padding: 6px 10px; background: #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin: 0 2px; }
        .btn-radio:checked { background: var(--primary); color: white; }
        .btn-radio::before { content: attr(data-label); }
        .advance-select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; text-align: center; }
        .submit-btn { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px 4px; text-align: center; border-bottom: 1px solid var(--border); }
        .btn-secondary { padding: 5px 8px; background: #64748b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .detail-item { padding: 8px; background: #f1f5f9; border-radius: 6px; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>🏆 Quiniela Pro</h1></header>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tabla')">📊 Posiciones</button>
        <button class="tab-btn" onclick="switchTab('registro')">📝 Registro</button>
        <button class="tab-btn" onclick="switchTab('admin')">⚙️ Admin</button>
    </div>

    <div id="panel-tabla" class="panel active">
        <table id="leaderboard"><thead><tr><th>Participante</th><th>Pts</th><th>Ver</th></tr></thead><tbody></tbody></table>
        <div id="user-details-section" style="margin-top: 20px; display: none;">
            <h3 style="text-align: center;">Pronósticos de: <span id="detail-user-name"></span></h3>
            <div id="details-space" class="details-grid"></div>
        </div>
    </div>

    <div id="panel-registro" class="panel">
        <input type="text" id="player-name" placeholder="Tu nombre..." style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px;">
        <div id="matches-form-container"></div>
        <button class="submit-btn" onclick="savePrediction()">Enviar por WhatsApp</button>
    </div>

    <div id="panel-admin" class="panel">
        <input type="password" id="admin-pass" placeholder="Contraseña..." style="width:100%; padding:10px; margin-bottom:10px;">
        <button class="btn-secondary" style="width:100%;" onclick="verifyAdmin()">Verificar</button>
        <div id="admin-content" style="display:none; margin-top:15px;">
            <div id="admin-matches-container"></div>
            <button class="submit-btn" onclick="saveOfficialResults()">Guardar Resultados</button>
        </div>
    </div>
</div>

<script>
    const MASTER_PARTICIPANTS = [{"name":"Laloquera","predictions":{"1":{"result":"V","advance":"Canadá"},"2":{"result":"L","advance":"Brasil"},"3":{"result":"L","advance":"Alemania"},"4":{"result":"V","advance":"Marruecos"},"5":{"result":"E","advance":"Costa de Marfil"},"6":{"result":"L","advance":"Francia"},"7":{"result":"L","advance":"México"},"8":{"result":"L","advance":"Inglaterra"},"9":{"result":"E","advance":"Senegal"},"10":{"result":"E","advance":"Estados Unidos"},"11":{"result":"L","advance":"España"},"12":{"result":"E","advance":"Portugal"},"13":{"result":"E","advance":"Suiza"},"14":{"result":"L","advance":"Australia"},"15":{"result":"L","advance":"Argentina"},"16":{"result":"L","advance":"Colombia"}},"name":"Chuma","predictions":{"1":{"result":"V","advance":"Canadá"},"2":{"result":"L","advance":"Brasil"},"3":{"result":"L","advance":"Alemania"},"4":{"result":"E","advance":"Países Bajos"},"5":{"result":"V","advance":"Noruega"},"6":{"result":"L","advance":"Francia"},"7":{"result":"L","advance":"México"},"8":{"result":"L","advance":"Inglaterra"},"9":{"result":"E","advance":"Senegal"},"10":{"result":"L","advance":"Estados Unidos"},"11":{"result":"L","advance":"España"},"12":{"result":"L","advance":"Portugal"},"13":{"result":"L","advance":"Suiza"},"14":{"result":"E","advance":"Egipto"},"15":{"result":"L","advance":"Argentina"},"16":{"result":"L","advance":"Colombia"}}}];
    const matches = [{id:1,home:"Sudáfrica",away:"Canadá"},{id:2,home:"Brasil",away:"Japón"},{id:3,home:"Alemania",away:"Paraguay"},{id:4,home:"Países Bajos",away:"Marruecos"},{id:5,home:"Costa de Marfil",away:"Noruega"},{id:6,home:"Francia",away:"Suecia"},{id:7,home:"México",away:"Ecuador"},{id:8,home:"Inglaterra",away:"RD Congo"},{id:9,home:"Bélgica",away:"Senegal"},{id:10,home:"Estados Unidos",away:"Bosnia y Herzegovina"},{id:11,home:"España",away:"Austria"},{id:12,home:"Portugal",away:"Croacia"},{id:13,home:"Suiza",away:"Argelia"},{id:14,home:"Australia",away:"Egipto"},{id:15,home:"Argentina",away:"Cabo Verde"},{id:16,home:"Colombia",away:"Ghana"}];
    
    // Resultado fijo del partido 1
    let officialResults = JSON.parse(localStorage.getItem('q_official')) || {"1":{"result":"V","advance":"Canadá"}};
    let participants = JSON.parse(localStorage.getItem('q_players_v2')) || MASTER_PARTICIPANTS;

    function initForms() {
        let regHTML = '', admHTML = '';
        matches.forEach(m => {
            regHTML += `<div class="match-card"><div class="teams-row"><span>${m.home}</span><span>${m.away}</span></div><div class="prediction-row"><input type="radio" name="rdo-${m.id}" data-label="L" value="L" class="btn-radio"> <input type="radio" name="rdo-${m.id}" data-label="E" value="E" class="btn-radio"> <input type="radio" name="rdo-${m.id}" data-label="V" value="V" class="btn-radio"></div><select id="pass-${m.id}" class="advance-select"><option value="">¿Quién clasifica?</option><option value="${m.home}">${m.home}</option><option value="${m.away}">${m.away}</option></select></div>`;
            admHTML += `<div class="match-card"><div class="teams-row"><span>${m.home}</span><span>${m.away}</span></div><div class="prediction-row"><input type="radio" name="adm-rdo-${m.id}" data-label="L" value="L" class="btn-radio"> <input type="radio" name="adm-rdo-${m.id}" data-label="E" value="E" class="btn-radio"> <input type="radio" name="adm-rdo-${m.id}" data-label="V" value="V" class="btn-radio"></div><select id="adm-pass-${m.id}" class="advance-select"><option value="">Sin definir</option><option value="${m.home}">${m.home}</option><option value="${m.away}">${m.away}</option></select></div>`;
        });
        document.getElementById('matches-form-container').innerHTML = regHTML;
        document.getElementById('admin-matches-container').innerHTML = admHTML;
    }

    function switchTab(t) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(`panel-${t}`).classList.add('active');
    }

    function renderLeaderboard() {
        const tbody = document.querySelector('#leaderboard tbody');
        tbody.innerHTML = '';
        participants.forEach(p => {
            let pts = 0;
            matches.forEach(m => {
                if(officialResults[m.id]) {
                    if(officialResults[m.id].result === p.predictions[m.id]?.result) pts++;
                    if(officialResults[m.id].advance === p.predictions[m.id]?.advance) pts++;
                }
            });
            tbody.innerHTML += `<tr><td>${p.name}</td><td><b>${pts}</b></td><td><button class="btn-secondary" onclick="viewDetails('${p.name}')">Ver</button></td></tr>`;
        });
    }

    function saveOfficialResults() {
        matches.forEach(m => {
            let rdo = document.querySelector(`input[name="adm-rdo-${m.id}"]:checked`);
            let adv = document.getElementById('adm-pass-'+m.id).value;
            if(rdo || adv) officialResults[m.id] = {result: rdo?.value || '', advance: adv};
        });
        localStorage.setItem('q_official', JSON.stringify(officialResults));
        renderLeaderboard(); alert('Resultados guardados');
    }

    function verifyAdmin() { if(document.getElementById('admin-pass').value === "1234") document.getElementById('admin-content').style.display = 'block'; }
    initForms(); renderLeaderboard();
</script>
</body>
</html>
