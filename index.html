<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Final Mundial</title>
    <style>
        :root { --primary: #1e3a8a; --green: #22c55e; --red: #ef4444; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); padding: 10px; }
        .container { max-width: 800px; margin: 0 auto; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #ddd; border: none; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; }
        .panel { display: none; background: white; padding: 20px; border-radius: 12px; }
        .panel.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; }
        .hit { background: var(--green); color: white; }
        .miss { background: var(--red); color: white; }
        .question { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align:center; margin-bottom:20px;"><h1>🏆 Quiniela Final</h1></header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('panel-tabla')">📊 Tabla y Ranking</button>
        <button class="tab-btn" onclick="switchTab('panel-registro')">📝 Registrar Pronósticos</button>
    </div>

    <!-- PANELES -->
    <div id="panel-tabla" class="panel active">
        <table id="leaderboard">
            <thead>
                <tr><th>Participante</th><th>Total</th><th>Detalle</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="panel-registro" class="panel">
        <input type="text" id="username" placeholder="Tu Nombre..." style="width:100%; padding:10px; margin-bottom:20px;">
        <div id="form-container"></div>
        <button onclick="submitQuiniela()" style="width:100%; padding:15px; background:var(--green); color:white; border:none; border-radius:8px; cursor:pointer;">Enviar por WhatsApp</button>
    </div>
</div>

<script>
// Configuración de preguntas
const questions = [
    {id: 1, text: "Gana Francia vs Marruecos", points: 1},
    {id: 2, text: "Marcador Fr/Mar", points: 1},
    {id: 3, text: "Mbappe Anota", points: 1},
    {id: 4, text: "Gana España vs Belgica", points: 1},
    {id: 5, text: "Marcador Esp/Bel", points: 1},
    {id: 6, text: "Lamine Anota", points: 1},
    {id: 7, text: "Gana Ing vs Nor", points: 1},
    {id: 8, text: "Marcador Ing/Nor", points: 1},
    {id: 9, text: "Kane Anota", points: 1},
    {id: 10, text: "Haland Anota", points: 1},
    {id: 11, text: "Gana Arg vs Sui", points: 1},
    {id: 12, text: "Marcador Arg/Sui", points: 1},
    {id: 13, text: "Messi Anota", points: 1},
    {id: 14, text: "Avanza Semis 1", points: 1},
    {id: 15, text: "Avanza Semis 2", points: 1},
    {id: 16, text: "Avanza Semis 3", points: 1},
    {id: 17, text: "Avanza Semis 4", points: 1},
    {id: 18, text: "Semifinal 1", points: 1},
    {id: 19, text: "Semifinal 2", points: 1},
    {id: 20, text: "Finalista 1", points: 2},
    {id: 21, text: "Finalista 2", points: 2},
    {id: 22, text: "Final", points: 2},
    {id: 23, text: "3er Lugar 1", points: 2},
    {id: 24, text: "3er Lugar 2", points: 2},
    {id: 25, text: "Partido 3er lugar", points: 2},
    {id: 26, text: "Campeón", points: 2},
    {id: 27, text: "Subcampeón", points: 2},
    {id: 28, text: "3er lugar", points: 2},
    {id: 29, text: "Goleador", points: 2}
];

// Inicializar
let participants = JSON.parse(localStorage.getItem('quiniela_final_data')) || [];
let officialResults = JSON.parse(localStorage.getItem('quiniela_final_results')) || {};

function switchTab(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// Cargar Formulario
const container = document.getElementById('form-container');
questions.forEach(q => {
    container.innerHTML += `<div class="question">
        <label>${q.id}. ${q.text}</label><br>
        <input type="text" id="q${q.id}" style="width:100%; padding:5px;">
    </div>`;
});

function calculateScore(p) {
    let total = 0;
    questions.forEach(q => {
        if(p.answers['q'+q.id] === officialResults['q'+q.id]) {
            total += q.points;
        }
    });
    return total;
}

function renderLeaderboard() {
    const tbody = document.querySelector('#leaderboard tbody');
    tbody.innerHTML = '';
    // Ordenar por puntos
    let sorted = participants.sort((a,b) => calculateScore(b) - calculateScore(a));
    
    sorted.forEach(p => {
        let score = calculateScore(p);
        tbody.innerHTML += `<tr>
            <td>${p.name}</td>
            <td><b>${score}</b></td>
            <td><button onclick="alert('Detalles pronto')">Ver</button></td>
        </tr>`;
    });
}

function submitQuiniela() {
    let answers = {};
    questions.forEach(q => { answers['q'+q.id] = document.getElementById('q'+q.id).value; });
    let name = document.getElementById('username').value;
    
    let data = btoa(JSON.stringify({name, answers}));
    window.open(`https://api.whatsapp.com/send?phone=5215546879724&text=Mis pronósticos: ${data}`);
}

window.onload = renderLeaderboard;
</script>
</body>
</html>
