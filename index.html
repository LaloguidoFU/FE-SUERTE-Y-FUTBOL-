<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Final - Mundial</title>
    <style>
        :root { --primary: #1e3a8a; --green: #22c55e; --red: #dc2626; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #e2e8f0; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        .q-card { margin-bottom: 15px; padding: 15px; border-left: 4px solid var(--primary); background: #f1f5f9; border-radius: 4px; }
        .q-card select, .q-card input { width: 100%; padding: 8px; margin-top: 5px; }
        .btn-send { width: 100%; padding: 15px; background: var(--green); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center;">🏆 Gran Final: Quiniela</h2>
    
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('registro')">📝 Registrar</button>
        <button class="tab-btn" onclick="switchTab('tabla')">📊 Tabla</button>
    </div>

    <!-- PANEL REGISTRO -->
    <div id="registro" class="panel active">
        <input type="text" id="p-name" placeholder="Tu nombre..." style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;">
        <div id="form-questions"></div>
        <button class="btn-send" onclick="validateAndSend()">Enviar Pronósticos a WhatsApp</button>
    </div>

    <!-- PANEL TABLA -->
    <div id="tabla" class="panel">
        <table id="leaderboard">
            <thead><tr><th>Participante</th><th>Total Pts</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
const questions = [
    {id:1, txt:"Resultado Francia vs Marruecos", type:"select", opt:["Francia", "Empate", "Marruecos"]},
    {id:2, txt:"Marcador Fr (Izq) vs Mar (Der)", type:"score"},
    {id:3, txt:"¿Mbappe Anotará?", type:"select", opt:["Si", "No"]},
    {id:4, txt:"Resultado España vs Belgica", type:"select", opt:["España", "Empate", "Belgica"]},
    {id:5, txt:"Marcador Esp (Izq) vs Bel (Der)", type:"score"},
    {id:6, txt:"¿Lamine Yamal Anotará?", type:"select", opt:["Si", "No"]},
    {id:7, txt:"Resultado Inglaterra vs Noruega", type:"select", opt:["Inglaterra", "Empate", "Noruega"]},
    {id:8, txt:"Marcador Ing (Izq) vs Nor (Der)", type:"score"},
    {id:9, txt:"¿Harry Kane Anotará?", type:"select", opt:["Si", "No"]},
    {id:10, txt:"¿Haland Anotará?", type:"select", opt:["Si", "No"]},
    {id:11, txt:"Resultado Argentina vs Suiza", type:"select", opt:["Argentina", "Empate", "Suiza"]},
    {id:12, txt:"Marcador Arg (Izq) vs Sui (Der)", type:"score"},
    {id:13, txt:"¿Messi Anotará?", type:"select", opt:["Si", "No"]},
    {id:14, txt:"¿Avanza Semifinal (del Francia/Mar)?", type:"select", opt:["Francia", "Marruecos"]},
    {id:15, txt:"¿Avanza Semifinal (del Esp/Bel)?", type:"select", opt:["España", "Belgica"]},
    {id:16, txt:"¿Avanza Semifinal (del Ing/Nor)?", type:"select", opt:["Inglaterra", "Noruega"]},
    {id:17, txt:"¿Avanza Semifinal (del Arg/Sui)?", type:"select", opt:["Argentina", "Suiza"]},
    {id:18, txt:"Partido 1ra Semifinal", type:"select", opt:["Francia vs Belgica", "Francia vs España", "Marruecos vs España", "Marruecos vs Belgica"]},
    {id:19, txt:"Partido 2da Semifinal", type:"select", opt:["Inglaterra vs Argentina", "Inglaterra vs Suiza", "Noruega vs Argentina", "Noruega vs Suiza"]},
    {id:20, txt:"1er Finalista", type:"select", opt:["Francia", "Marruecos", "España", "Belgica"]},
    {id:21, txt:"2do Finalista", type:"select", opt:["Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id:22, txt:"Partido de la Final", type:"select", opt:["Francia vs Noruega", "Francia vs Inglaterra", "Francia vs Argentina", "Francia vs Suiza", "España vs Noruega", "España vs Inglaterra", "España vs Argentina", "España vs Suiza", "Marruecos vs Noruega", "Marruecos vs Inglaterra", "Marruecos vs Argentina", "Marruecos vs Suiza", "Belgica vs Noruega", "Belgica vs Inglaterra", "Belgica vs Argentina", "Belgica vs Suiza"]},
    {id:23, txt:"1er 3er Lugar", type:"select", opt:["Francia", "Marruecos", "España", "Belgica"]},
    {id:24, txt:"2do 3er Lugar", type:"select", opt:["Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id:25, txt:"Partido de 3er lugar", type:"select", opt:["Francia vs Noruega", "Francia vs Inglaterra", "Francia vs Argentina", "Francia vs Suiza", "España vs Noruega", "España vs Inglaterra", "España vs Argentina", "España vs Suiza", "Marruecos vs Noruega", "Marruecos vs Inglaterra", "Marruecos vs Argentina", "Marruecos vs Suiza", "Belgica vs Noruega", "Belgica vs Inglaterra", "Belgica vs Argentina", "Belgica vs Suiza"]},
    {id:26, txt:"Campeón Mundial", type:"select", opt:["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id:27, txt:"Sub-campeón Mundial", type:"select", opt:["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id:28, txt:"3er Lugar Mundial", type:"select", opt:["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id:29, txt:"Máximo Goleador", type:"select", opt:["Lionel Messi", "Mbappe", "Haaland", "Harry Kane", "Dembele", "Oyarzabal", "Otro"]}
];

// GENERAR FORMULARIO
const formContainer = document.getElementById('form-questions');
questions.forEach(q => {
    let html = `<div class="q-card"><label>${q.id}. ${q.txt}</label>`;
    if(q.type === 'select') {
        html += `<select id="q${q.id}"><option value="">Selecciona...</option>`;
        q.opt.forEach(o => html += `<option value="${o}">${o}</option>`);
        html += `</select>`;
    } else {
        html += `<div style="display:flex; gap:5px;"><input type="number" id="q${q.id}_h" placeholder="0"> - <input type="number" id="q${q.id}_a" placeholder="0"></div>`;
    }
    formContainer.innerHTML += html + `</div>`;
});

function switchTab(t) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    event.target.classList.add('active');
}

function validateAndSend() {
    let name = document.getElementById('p-name').value;
    if(!name) return alert("Ingresa tu nombre");
    
    // Aquí es donde sucede la lógica de validación que pediste
    let q1 = document.getElementById('q1').value;
    let q14 = document.getElementById('q14').value;
    
    // Ejemplo de validación básica:
    if(q1 !== "Empate" && q14 && !q1.includes(q14)) {
        return alert("¡Error! En la pregunta 14 seleccionaste un equipo que no ganó/empató en la pregunta 1.");
    }

    let answers = { name };
    questions.forEach(q => {
        if(q.type === 'select') answers['q'+q.id] = document.getElementById('q'+q.id).value;
        else answers['q'+q.id] = document.getElementById('q'+q.id+'_h').value + "-" + document.getElementById('q'+q.id+'_a').value;
    });

    let data = btoa(JSON.stringify(answers));
    window.open(`https://api.whatsapp.com/send?phone=5215546879724&text=Mis pronósticos finales: ${data}`);
}
</script>
</body>
</html>
