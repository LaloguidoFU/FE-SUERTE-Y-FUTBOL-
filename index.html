function renderTable() {
    const headerRow = document.getElementById('header-row');
    const bodyRows = document.getElementById('body-rows');
    headerRow.innerHTML = '<th>Participante</th><th class="points-col">PTS</th>';
    qList.forEach(q => headerRow.innerHTML += `<th>${q.id}</th>`);
    baseDeDatos.forEach(p => {
        let row = `<tr><td>${p.name}</td>`;
        let totalPuntos = 0, celdas = '';
        qList.forEach(q => {
            let val = p.answers['q'+q.id] || '-';
            let real = resultadosReales['q'+q.id];
            let clase = '';
            if (real) {
                if (val === real) { clase = 'acierto'; totalPuntos += q.points; }
                else { clase = 'fallo'; }
            }
            celdas += `<td class="${clase}">${val}</td>`;
        });
        row += `<td class="points-col">${totalPuntos}</td>${celdas}</tr>`;
        bodyRows.innerHTML += row;
    });
}
renderTable();
