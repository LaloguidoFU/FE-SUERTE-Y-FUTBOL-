<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiniela Dieciseisavos de Final</title>
    <style>
        :root { --primary: #1e3a8a; --primary-light: #3b82f6; --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; --green: #22c55e; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        
        header { text-align: center; margin-bottom: 20px; padding: 15px; background: var(--primary); color: white; border-radius: 12px; }
        .reglas { background: #ffffff; padding: 15px; border-radius: 12px; border: 2px solid var(--primary); margin: 15px 0; text-align: left; color: #334155; font-size: 13px; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #cbd5e1; font-size: 12px; }
        .tab-btn.active { background: var(--primary-light); color: white; }

        .panel { display: none; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .panel.active { display: block; }

        /* Ajuste de tarjetas de partido para móvil */
        .match-card { display: flex; flex-direction: column; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: #fafafa; }
        .teams-row { width: 100%; display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
        .options-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        
        .btn-radio { appearance: none; padding: 6px 10px; background: #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-radio:checked { background: var(--primary); color: white; }
        .btn-radio::before { content: attr(data-label); }

        .advance-select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; text-align: center; }
        .submit-btn { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        table { width: 100%; font-size: 12px; border-collapse: collapse; }
        th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--border); }
        
        .btn-secondary { padding: 5px 8px; background: #64748b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; }
        textarea { width: 100%; height: 60px; font-size: 11px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏆 Quiniela Pro</h1>
        <div class="reglas">
            <strong>📜 Reglas de Juego:</strong>
            <ul style="padding-left: 18px; margin-top: 5px;">
                <li><b>Costo:</b> $100 MXN.</li>
                <li><b>Puntos:</b> 1 pt x resultado (90') + 1 pt x clasificado.</li>
                <li><b>Ganador:</b> Quien acumule más puntos.</li>
                <li><b>Empates:</b> El premio se reparte entre los ganadores.</li>
            </ul>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tabla')">📊 Posiciones</button>
        <button class="tab-btn" onclick="switchTab('registro')">📝 Pronóstico</button>
        <button class="tab-btn" onclick="switchTab('admin')">⚙️ Admin</button>
    </div>

    <div id="panel-tabla" class="panel active">
        <table id="leaderboard"><thead><tr><th>Pos</th><th>Nombre</th><th>Pts</th><th>Ver</th></tr></thead><tbody></tbody></table>
        <div id="user-details-section" style="margin-top: 15px; display: none; font-size: 12px;">
            <h3>Detalles: <span id="detail-user-name"></span></h3>
            <div id="details-space"></div>
        </div>
    </div>

    <div id="panel-registro" class="panel">
        <input type="text" id="player-name" placeholder="Tu nombre..." style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc;">
        <div id="matches-form-container"></div>
        <button class="submit-btn" onclick="savePrediction()">Enviar por WhatsApp</button>
    </div>

    <div id="panel-admin" class="panel">
        <input type="password" id="admin-pass" placeholder="Contraseña..." style="width:100%; padding:8px; margin-bottom:10px;">
        <button class="btn-secondary" onclick="verifyAdmin()">Verificar</button>
        <div id="admin-content" style="display:none; margin-top:15px;">
            <input type="text" id="whatsapp-code-input" placeholder="Código participante..." style="width:100%; padding:8px; margin-bottom:10px;">
            <button class="btn-secondary" onclick="importParticipantCode()">Agregar</button>
            <div id="admin-matches-container" style="margin-top:15px;"></div>
            <button class="submit-btn" onclick="saveOfficialResults()" style="margin-top:10px;">Guardar Resultados</button>
            <button class="btn-secondary" onclick="exportData()" style="margin-top:10px; background:#1e3a8a;">Generar Respaldo</button>
            <textarea id="io-data" readonly></textarea>
        </div>
    </div>
</div>

<script>
    const MASTER_RESULTS = {"1":{"result":null,"advance":null},"2":{"result":null,"advance":null},"3":{"result":null,"advance":null},"4":{"result":null,"advance":null},"5":{"result":null,"advance":null},"6":{"result":null,"advance":null},"7":{"result":null,"advance":null},"8":{"result":null,"advance":null},"9":{"result":null,"advance":null},"10":{"result":null,"advance":null},"11":{"result":null,"advance":null},"12":{"result":null,"advance":null},"13":{"result":null,"advance":null},"14":{"result":null,"advance":null},"15":{"result":null,"advance":null},"16":{"result":null,"advance":null}}; 
    const MASTER_PARTICIPANTS = [{"name":"Zaid","predictions":{"1":{"result":"L","advance":"Sudáfrica"},"2":{"result":"E","advance":"Brasil"},"3":{"result":"L","advance":"Alemania"},"4":{"result":"L","advance":"Países Bajos"},"5":{"result":"V","advance":"Costa de Marfil"},"6":{"result":"E","advance":"Francia"},"7":{"result":"E","advance":"México"},"8":{"result":"E","advance":"Inglaterra"},"9":{"result":"E","advance":"Senegal"},"10":{"result":"V","advance":"Bosnia y Herzegovina"},"11":{"result":"V","advance":"España"},"12":{"result":"V","advance":"Croacia"},"13":{"result":"E","advance":"Suiza"},"14":{"result":"E","advance":"Egipto"},"15":{"result":"V","advance":"Argentina"},"16":{"result":"E","advance":"Colombia"}},"total":0},{"name":"Prueba","predictions":{"1":{"result":"E","advance":"Sudáfrica"},"2":{"result":"V","advance":"Japón"},"3":{"result":"E","advance":"Paraguay"},"4":{"result":"V","advance":"Países Bajos"},"5":{"result":"L","advance":"Costa de Marfil"},"6":{"result":"L","advance":"Suecia"},"7":{"result":"L","advance":"México"},"8":{"result":"L","advance":"RD Congo"},"9":{"result":"V","advance":"Senegal"},"10":{"result":"V","advance":"Estados Unidos"},"11":{"result":"V","advance":"Austria"},"12":{"result":"V","advance":"Portugal"},"13":{"result":"E","advance":"Argelia"},"14":{"result":"L","advance":"Australia"},"15":{"result":"E","advance":"Cabo Verde"},"16":{"result":"V","advance":"Colombia"}},"total":0},{"name":"I'm so tired","predictions":{"1":{"result":"L","advance":"Sudáfrica"},"2":{"result":"E","advance":"Brasil"},"3":{"result":"L","advance":"Paraguay"},"4":{"result":"E","advance":"Países Bajos"},"5":{"result":"E","advance":"Costa de Marfil"},"6":{"result":"E","advance":"Francia"},"7":{"result":"L","advance":"México"},"8":{"result":"V","advance":"RD Congo"},"9":{"result":"V","advance":"Senegal"},"10":{"result":"L","advance":"Estados Unidos"},"11":{"result":"E","advance":"España"},"12":{"result":"L","advance":"Portugal"},"13":{"result":"V","advance":"Argelia"},"14":{"result":"V","advance":"Egipto"},"15":{"result":"L","advance":"Argentina"},"16":{"result":"L","advance":"Colombia"}},"total":0},{"name":"Holi","predictions":{"1":{"result":"L","advance":"Sudáfrica"},"2":{"result":"L","advance":"Brasil"},"3":{"result":"L","advance":"Alemania"},"4":{"result":"L","advance":"Países Bajos"},"5":{"result":"L","advance":"Costa de Marfil"},"6":{"result":"L","advance":"Suecia"},"7":{"result":"L","advance":"México"},"8":{"result":"L","advance":"Inglaterra"},"9":{"result":"L","advance":"Bélgica"},"10":{"result":"L","advance":"Estados Unidos"},"11":{"result":"L","advance":"España"},"12":{"result":"L","advance":"Portugal"},"13":{"result":"L","advance":"Suiza"},"14":{"result":"L","advance":"Australia"},"15":{"result":"L","advance":"Argentina"},"16":{"result":"L","advance":"Colombia"}},"total":0}];
    const ADMIN_PASSWORD = "1234"; const WHATSAPP_PHONE = "5215546879724";
    const matches = [{id:1,home:"Sudáfrica",away:"Canadá"},{id:2,home:"Brasil",away:"Japón"},{id:3,home:"Alemania",away:"Paraguay"},{id:4,home:"Países Bajos",away:"Marruecos"},{id:5,home:"Costa de Marfil",away:"Noruega"},{id:6,home:"Francia",away:"Suecia"},{id:7,home:"México",away:"Ecuador"},{id:8,home:"Inglaterra",away:"RD Congo"},{id:9,home:"Bélgica",away:"Senegal"},{id:10,home:"Estados Unidos",away:"Bosnia y Herzegovina"},{id:11,home:"España",away:"Austria"},{id:12,home:"Portugal",away:"Croacia"},{id:13,home:"Suiza",away:"Argelia"},{id:14,home:"Australia",away:"Egipto"},{id:15,home:"Argentina",away:"Cabo Verde"},{id:16,home:"Colombia",away:"Ghana"}];

    let participants = JSON.parse(localStorage.getItem('q_players')) || MASTER_PARTICIPANTS;
    let officialResults = JSON.parse(localStorage.getItem('q_official')) || MASTER_RESULTS;

    window.onload = () => { initForms(); renderLeaderboard(); };

    function initForms() {
        let regHTML = '', admHTML = '';
        matches.forEach(m => {
            regHTML += `<div class="match-card"><div class="teams-row"><span>${m.home}</span><small>vs</small><span>${m.away}</span></div><div class="options-container"><div class="prediction-row"><input type="radio" name="rdo-${m.id}" data-label="L" value="L" class="btn-radio"> <input type="radio" name="rdo-${m.id}" data-label="E" value="E" class="btn-radio"> <input type="radio" name="rdo-${m.id}" data-label="V" value="V" class="btn-radio"></div><select id="pass-${m.id}" class="advance-select"><option value="">¿Quién clasifica?</option><option value="${m.home}">${m.home}</option><option value="${m.away}">${m.away}</option></select></div></div>`;
            admHTML += `<div class="match-card"><div class="teams-row"><span>${m.home}</span><small>vs</small><span>${m.away}</span></div><div class="options-container"><div class="prediction-row"><input type="radio" name="adm-rdo-${m.id}" data-label="L" value="L" class="btn-radio"> <input type="radio" name="adm-rdo-${m.id}" data-label="E" value="E" class="btn-radio"> <input type="radio" name="adm-rdo-${m.id}" data-label="V" value="V" class="btn-radio"></div><select id="adm-pass-${m.id}" class="advance-select"><option value="">Sin definir</option><option value="${m.home}">${m.home}</option><option value="${m.away}">${m.away}</option></select></div></div>`;
        });
        document.getElementById('matches-form-container').innerHTML = regHTML;
        document.getElementById('admin-matches-container').innerHTML = admHTML;
    }

    function switchTab(t) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(`panel-${t}`).classList.add('active');
    }

    function renderLeaderboard() {
        const tbody = document.querySelector('#leaderboard tbody');
        tbody.innerHTML = '';
        participants.map(p => {
            let ptsR = 0, ptsA = 0;
            matches.forEach(m => {
                if(officialResults[m.id] && p.predictions[m.id]) {
                    if(officialResults[m.id].result === p.predictions[m.id].result) ptsR++;
                    if(officialResults[m.id].advance === p.predictions[m.id].advance) ptsA++;
                }
            });
            return {name: p.name, total: ptsR + ptsA};
        }).sort((a,b) => b.total - a.total).forEach((p, i) => {
            tbody.innerHTML += `<tr><td>${i+1}</td><td>${p.name}</td><td><b>${p.total}</b></td><td><button class="btn-secondary" onclick="alert('${p.name} tiene ${p.total} pts')">Ver</button></td></tr>`;
        });
    }

    function savePrediction() {
        const name = document.getElementById('player-name').value;
        if(!name) return alert('Pon tu nombre');
        let preds = {};
        matches.forEach(m => {
            let rdo = document.querySelector(`input[name="rdo-${m.id}"]:checked`);
            preds[m.id] = {result: rdo ? rdo.value : '', advance: document.getElementById('pass-'+m.id).value};
        });
        let data = btoa(JSON.stringify({name, predictions: preds}));
        window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_PHONE}&text=Mi código es: ${data}`);
    }

    function verifyAdmin() { if(document.getElementById('admin-pass').value === ADMIN_PASSWORD) document.getElementById('admin-content').style.display = 'block'; }
    function importParticipantCode() {
        try {
            let code = document.getElementById('whatsapp-code-input').value;
            let p = JSON.parse(atob(code));
            participants.push(p);
            localStorage.setItem('q_players', JSON.stringify(participants));
            alert('Agregado'); renderLeaderboard();
        } catch(e) { alert('Código inválido'); }
    }
    function saveOfficialResults() {
        matches.forEach(m => {
            let rdo = document.querySelector(`input[name="adm-rdo-${m.id}"]:checked`);
            officialResults[m.id] = {result: rdo ? rdo.value : '', advance: document.getElementById('adm-pass-'+m.id).value};
        });
        localStorage.setItem('q_official', JSON.stringify(officialResults));
        alert('Resultados guardados'); renderLeaderboard();
    }
    function exportData() { document.getElementById('io-data').value = JSON.stringify({official: officialResults, players: participants}); }
</script>
</body>
</html>
