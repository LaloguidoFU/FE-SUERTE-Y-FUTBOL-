

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela: Registro y Resultados</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; font-size: 18px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        
        /* Estilos del Formulario (Grande) */
        .q-box { margin-bottom: 25px; padding: 15px; border-bottom: 2px solid #eee; }
        label { font-size: 20px; font-weight: 600; display: block; margin-bottom: 10px; }
        select { width: 100%; padding: 15px; font-size: 18px; border-radius: 10px; border: 2px solid #ccc; }
        .score-row { display: flex; gap: 10px; align-items: center; }
        .score-input { width: 45%; padding: 15px; font-size: 18px; border-radius: 10px; border: 2px solid #ccc; text-align: center; }
        
        /* Tabla */
        .table-wrapper { overflow-x: auto; margin-top: 50px; border-top: 4px solid #1e3a8a; padding-top: 20px; }
        table { border-collapse: collapse; width: 100%; font-size: 16px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #1e3a8a; color: white; }
        
        .acierto { background-color: #86efac; color: #065f46; font-weight: bold; }
        .fallo { background-color: #fca5a5; color: #991b1b; }
        .points-col { font-weight: bold; background: #fef08a; }
        
        .btn-main { width: 100%; padding: 25px; font-size: 22px; background: #1e3a8a; color: white; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 Quiniela: Registro y Marcador</h2>

    <!-- FORMULARIO -->
    <div id="form-container"></div>
    <input type="text" id="username" placeholder="Tu Nombre" style="width:100%; padding:15px; font-size:18px; margin-bottom:20px; border-radius:10px;">
    <button class="btn-main" onclick="enviarValidado()">Registrar y WhatsApp</button>

    <!-- TABLA DE RESULTADOS -->
    <div class="table-wrapper">
        <h3>📊 Tabla de Posiciones</h3>
        <table id="results-table">
            <thead><tr id="header-row"></tr></thead>
            <tbody id="body-rows"></tbody>
        </table>
    </div>
</div>

<script>
/* 1. CONFIGURACIÓN: Resultados Reales (Actualiza esto conforme avance el mundial) */
const resultadosReales = {
    "q1": "Francia", "q2": "2-1" // Ejemplo
};

/* 2. BASE DE DATOS: Tus participantes manuales */
const baseDeDatos = [
    { name: "Arellano", answers: {"q1": "Francia", "q2": "2-1"} },
    { name: "Prueba 1", answers: {"q1": "Empate", "q2": "1-1"} }
];

const qList = [
    {id: 1, label: "Francia vs Marruecos", type: "select", opts: ["Francia", "Empate", "Marruecos"]},
    {id: 2, label: "Marcador Fr-Mar", type: "score"},
    // ... agrega el resto de tus 29 preguntas aquí con el mismo formato
];

// Generar Formulario dinámico
const container = document.getElementById('form-container');
qList.forEach(q => {
    let html = `<div class="q-box"><label>${q.id}. ${q.label}</label>`;
    if (q.type === 'score') {
        html += `<div class="score-row"><input type="number" id="q${q.id}_h" class="score-input" placeholder="0"><span>-</span><input type="number" id="q${q.id}_a" class="score-input" placeholder="0"></div>`;
    } else {
        html += `<select id="q${q.id}"><option value="">Selecciona...</option>${q.opts.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
    }
    container.innerHTML += html + `</div>`;
});

// Renderizar Tabla
function renderTable() {
    const headerRow = document.getElementById('header-row');
    const bodyRows = document.getElementById('body-rows');
    headerRow.innerHTML = '<th>Participante</th><th class="points-col">PTS</th>';
    qList.forEach(q => headerRow.innerHTML += `<th>${q.id}</th>`);
    
    baseDeDatos.forEach(p => {
        let row = `<tr><td>${p.name}</td>`;
        let puntos = 0;
        let celdas = '';
        qList.forEach(q => {
            let val = p.answers['q'+q.id] || '-';
            let real = resultadosReales['q'+q.id];
            let clase = '';
            if (real) {
                if (val === real) { clase = 'acierto'; puntos++; }
                else { clase = 'fallo'; }
            }
            celdas += `<td class="${clase}">${val}</td>`;
        });
        row += `<td class="points-col">${puntos}</td>${celdas}</tr>`;
        bodyRows.innerHTML += row;
    });
}

function enviarValidado() {
    // Aquí iría tu lógica de validación anterior y el window.open
    alert("Procesando pronóstico...");
}

renderTable();
</script>
</body>
</html>
