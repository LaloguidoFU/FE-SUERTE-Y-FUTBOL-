<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiniela Pro - Dieciseisavos</title>
    <style>
        :root { --primary: #1e3a8a; --primary-light: #3b82f6; --bg: #f8fafc; --text: #0f172a; --green: #22c55e; --red: #ef4444; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg); padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        .panel { display: none; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 10px; }
        .panel.active { display: block; }
        .match-card { padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: #fafafa; }
        .btn-radio { padding: 5px 10px; cursor: pointer; }
        .advance-select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; border: 1px solid var(--border); }
        .submit-btn { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 8px; cursor: pointer; }
        table { width: 100%; font-size: 11px; border-collapse: collapse; }
        td, th { padding: 8px 2px; border-bottom: 1px solid var(--border); text-align: center; }
        .hit { background: var(--green) !important; color: white; }
        .miss { background: var(--red) !important; color: white; }
        .top-player { background: #fef3c7 !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button onclick="switchTab('tabla')">📊 Posiciones</button>
        <button onclick="switchTab('registro')">📝 Registro</button>
        <button onclick="switchTab('admin')">⚙️ Admin</button>
    </div>

    <div id="panel-tabla" class="panel active">
        <table id="leaderboard"><thead><tr><th>Participante</th><th>Res</th><th>Clas</th><th>Total</th><th>Ver</th></tr></thead><tbody></tbody></table>
        <div id="user-details-section" style="margin-top: 20px; display: none;">
            <h3 id="detail-user-name"></h3>
            <div id="details-space" style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;"></div>
        </div>
    </div>

    <div id="panel-registro" class="panel">
        <input type="text" id="player-name" placeholder="Tu nombre..." style="width:100%; padding:10px;">
        <div id="matches-form-container"></div>
        <button class="submit-btn" onclick="savePrediction()">Enviar por WhatsApp</button>
    </div>

    <div id="panel-admin" class="panel">
        <input type="password" id="admin-pass" placeholder="Contraseña...">
        <button onclick="verifyAdmin()">Verificar</button>
        <div id="admin-content" style="display:none;">
            <input type="text" id="whatsapp-code-input" placeholder="Código...">
            <button onclick="importParticipantCode()">Agregar</button>
            <div id="admin-matches-container"></div>
            <button class="submit-btn" onclick="saveOfficialResults()">Guardar Resultados</button>
        </div>
    </div>
</div>

<script>
    const matches = [{id:1,home:"Sudáfrica",away:"Canadá"},{id:2,home:"Brasil",away:"Japón"},{id:3,home:"Alemania",away:"Paraguay"},{id:4,home:"Países Bajos",away:"Marruecos"},{id:5,home:"Costa de Marfil",away:"Noruega"},{id:6,home:"Francia",away:"Suecia"},{id:7,home:"México",away:"Ecuador"},{id:8,home:"Inglaterra",away:"RD Congo"},{id:9,home:"Bélgica",away:"Senegal"},{id:10,home:"Estados Unidos",away:"Bosnia y Herzegovina"},{id:11,home:"España",away:"Austria"},{id:12,home:"Portugal",away:"Croacia"},{id:13,home:"Suiza",away:"Argelia"},{id:14,home:"Australia",away:"Egipto"},{id:15,home:"Argentina",away:"Cabo Verde"},{id:16,home:"Colombia",away:"Ghana"}];
    
    let participants = JSON.parse(localStorage.getItem('q_players_v2')) || [];
    let officialResults = JSON.parse(localStorage.getItem('q_official')) || {};

    function initForms() {
        let regHTML = '', admHTML = '';
        matches.forEach(m => {
            regHTML += `<div class="match-card"><b>${m.home} vs ${m.away}</b><br>
                <input type="radio" name="rdo-${m.id}" value="L"> L <input type="radio" name="rdo-${m.id}" value="E"> E <input type="radio" name="rdo-${m.id}" value="V"> V
                <select id="pass-${m.id}" class="advance-select"><option value="">¿Quién pasa?</option><option value="${m.home}">${m.home}</option><option value="${m.away}">${m.away}</option></select></div>`;
            admHTML += `<div class="match-card"><b>${m.home} vs ${m.away}</b><br>
                <input type="radio" name="adm-rdo-${m.id}" value="L"> L <input type="radio" name="adm-rdo-${m.id}" value="E"> E <input type="radio" name="adm-rdo-${m.id}" value="V"> V
                <select id="adm-pass-${m.id}" class="advance-select"><option value="">Sin definir</option><option value="${m.home}">${m.home}</option><option value="${m.away}">${m.away}</option></select></div>`;
        });
        document.getElementById('matches-form-container').innerHTML = regHTML;
        document.getElementById('admin-matches-container').innerHTML = admHTML;
    }

    function switchTab(t) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${t}`).classList.add('active');
    }

    function renderLeaderboard() {
        const tbody = document.querySelector('#leaderboard tbody');
        tbody.innerHTML = '';
        let ranking = participants.map(p => {
            let ptsRes = 0, ptsClas = 0;
            matches.forEach(m => {
                if(officialResults[m.id] && p.predictions[m.id]) {
                    if(officialResults[m.id].result === p.predictions[m.id].result) ptsRes++;
                    if(officialResults[m.id].advance === p.predictions[m.id].advance) ptsClas++;
                }
            });
            return { ...p, ptsRes, ptsClas, total: ptsRes + ptsClas };
        });
        ranking.sort((a,b) => b.total - a.total);
        ranking.forEach((p, i) => {
            let rowClass = i === 0 ? 'class="top-player"' : '';
            tbody.innerHTML += `<tr ${rowClass}><td>${p.name}</td><td>${p.ptsRes}</td><td>${p.ptsClas}</td><td><b>${p.total}</b></td><td><button onclick="viewDetails('${p.name}')">Ver</button></td></tr>`;
        });
    }

    function viewDetails(name) {
        let p = participants.find(x => x.name === name);
        document.getElementById('user-details-section').style.display = 'block';
        document.getElementById('detail-user-name').innerText = "Pronósticos de: " + p.name;
        let space = document.getElementById('details-space'); space.innerHTML = '';
        matches.forEach(m => {
            let pr = p.predictions[m.id], off = officialResults[m.id] || {};
            let resC = off.result ? (pr.result === off.result ? 'hit' : 'miss') : '';
            let advC = off.advance ? (pr.advance === off.advance ? 'hit' : 'miss') : '';
            space.innerHTML += `<div style="padding:5px; font-size:10px;">${m.home.slice(0,3)} vs ${m.away.slice(0,3)}<br><span class="${resC}">R:${pr.result}</span> <span class="${advC}">P:${pr.advance.slice(0,6)}</span></div>`;
        });
    }

    function savePrediction() {
        const name = document.getElementById('player-name').value;
        let preds = {};
        matches.forEach(m => {
            let r = document.querySelector(`input[name="rdo-${m.id}"]:checked`);
            preds[m.id] = {result: r ? r.value : '', advance: document.getElementById('pass-'+m.id).value};
        });
        let data = btoa(JSON.stringify({name, predictions: preds}));
        window.open(`https://api.whatsapp.com/send?phone=5215546879724&text=Mi código es: ${data}`);
    }

    function verifyAdmin() { if(document.getElementById('admin-pass').value === "1234") document.getElementById('admin-content').style.display = 'block'; }
    function importParticipantCode() {
        let p = JSON.parse(atob(document.getElementById('whatsapp-code-input').value));
        participants.push(p); localStorage.setItem('q_players_v2', JSON.stringify(participants)); renderLeaderboard();
    }
    function saveOfficialResults() {
        matches.forEach(m => {
            let r = document.querySelector(`input[name="adm-rdo-${m.id}"]:checked`);
            officialResults[m.id] = {result: r ? r.value : '', advance: document.getElementById('adm-pass-'+m.id).value};
        });
        localStorage.setItem('q_official', JSON.stringify(officialResults));
        renderLeaderboard();
    }

    initForms();
    renderLeaderboard();
</script>
</body>
</html>
