        .reference-box { background: #eef2ff; padding: 25px; border-radius: 15px; margin-bottom: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border: 1px solid #c7d2fe; }

        .q-box { margin-bottom: 40px; padding: 20px; border-bottom: 2px solid #eee; }

        .score-row { display: flex; gap: 15px; align-items: center; }
        .score-input { width: 80px; padding: 20px; text-align: center; border-radius: 10px; border: 2px solid #ccc; font-size: 20px; }
        .table-wrapper { overflow-x: auto; margin-top: 60px; }
        table { border-collapse: collapse; width: 100%; font-size: 18px; }
        th, td { border: 2px solid #ddd; padding: 20px; text-align: center; min-width: 100px; }
        th { background: #1e3a8a; color: white; font-size: 20px; }
        .acierto { background-color: #86efac; color: #065f46; font-weight: bold; }
        .fallo { background-color: #fca5a5; color: #991b1b; }
        .points-col { font-weight: bold; background: #fef08a; font-size: 24px; }
        .btn-main { width: 100%; padding: 30px; font-size: 28px; background: #1e3a8a; color: white; border: none; border-radius: 15px; cursor: pointer; }
    </style>
</head>
