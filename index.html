<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Final - Validada</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; font-size: 18px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .tab-btn { flex: 1; padding: 20px; font-size: 20px; font-weight: bold; border: none; background: #e2e8f0; cursor: pointer; border-radius: 10px; }
        .tab-btn.active { background: #1e3a8a; color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        .q-box { margin-bottom: 30px; padding: 20px; border-bottom: 2px solid #eee; }
        label { font-size: 20px; font-weight: 600; display: block; margin-bottom: 10px; }
        select { width: 100%; padding: 15px; font-size: 18px; margin-top: 5px; border-radius: 10px; border: 2px solid #ccc; background: white; cursor: pointer; }
        .score-row { display: flex; gap: 10px; align-items: center; }
        .score-input { width: 45%; padding: 15px; font-size: 18px; border-radius: 10px; border: 2px solid #ccc; text-align: center; }
        input[type="text"] { width: 100%; padding: 15px; font-size: 18px; border-radius: 10px; border: 2px solid #ccc; box-sizing: border-box; margin-bottom: 20px; }
        button.action-btn { width: 100%; padding: 25px; font-size: 22px; background: #1e3a8a; color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 18px; }
        th { background: #1e3a8a; color: white; padding: 15px; }
        td { border: 1px solid #ddd; padding: 15px; text-align: center; }
        .error { color: #dc2626; font-size: 20px; font-weight: bold; background: #fee2e2; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 Quiniela Final</h2>
    
    <div class="tabs">
        <button class="tab-btn active" id="btn-reg" onclick="showTab('reg')">📝 Registrar Pronóstico</button>
        <button class="tab-btn" id="btn-tab" onclick="showTab('tab')">📊 Ver Tabla</button>
    </div>

    <div id="panel-reg" class="panel active">
        <div id="error-msg" class="error"></div>
        <label>Nombre del Participante:</label>
        <input type="text" id="username" placeholder="Escribe tu nombre aquí...">
        <div id="form-container"></div>
        <button class="action-btn" onclick="enviarValidado()">Generar Enlace de WhatsApp</button>
    </div>

    <div id="panel-tab" class="panel">
        <table id="leaderboard">
            <thead><tr><th>Nombre</th><th>Estatus</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
// --- LISTA DE REGISTRADOS MANUAL ---
const baseDeDatos = [
    
{
  "name": "Prueba 1",
  "answers": {
    "q1": "Empate",
    "q2": "1-1",
    "q3": "No",
    "q4": "España",
    "q5": "1-0",
    "q6": "No",
    "q7": "Noruega",
    "q8": "1-2",
    "q9": "No",
    "q10": "Si",
    "q11": "Argentina",
    "q12": "2-0",
    "q13": "Si",
    "q14": "Marruecos",
    "q15": "España",
    "q16": "Noruega",
    "q17": "Argentina",
    "q18": "Marruecos vs España",
    "q19": "Inglaterra vs Argentina",
    "q20": "Marruecos",
    "q21": "Noruega",
    "q22": "Marruecos vs Noruega",
    "q23": "España",
    "q24": "Argentina",
    "q25": "España vs Argentina",
    "q26": "Marruecos",
    "q27": "Inglaterra",
    "q28": "Noruega",
    "q29": "Otro"
  }
}


];

const qList = [
    {id: 1, label: "Resultado Francia vs Marruecos", type: "select", opts: ["Francia", "Empate", "Marruecos"]},
    {id: 2, label: "Marcador Fr - Mar", type: "score"},
    {id: 3, label: "Mbappe Anotará", type: "select", opts: ["Si", "No"]},
    {id: 4, label: "Resultado España vs Belgica", type: "select", opts: ["España", "Empate", "Belgica"]},
    {id: 5, label: "Marcador Esp - Bel", type: "score"},
    {id: 6, label: "Lamine Yamal Anotará", type: "select", opts: ["Si", "No"]},
    {id: 7, label: "Resultado Inglaterra vs Noruega", type: "select", opts: ["Inglaterra", "Empate", "Noruega"]},
    {id: 8, label: "Marcador Ing - Nor", type: "score"},
    {id: 9, label: "Harry Kane Anotará", type: "select", opts: ["Si", "No"]},
    {id: 10, label: "Haland Anotará", type: "select", opts: ["Si", "No"]},
    {id: 11, label: "Resultado Argentina vs Suiza", type: "select", opts: ["Argentina", "Empate", "Suiza"]},
    {id: 12, label: "Marcador Arg - Sui", type: "score"},
    {id: 13, label: "Messi Anotará", type: "select", opts: ["Si", "No"]},
    {id: 14, label: "1er equipo que avanza (Semi)", type: "select", opts: ["Francia", "Marruecos"]},
    {id: 15, label: "2do equipo que avanza (Semi)", type: "select", opts: ["España", "Belgica"]},
    {id: 16, label: "3er equipo que avanza (Semi)", type: "select", opts: ["Inglaterra", "Noruega"]},
    {id: 17, label: "4to equipo que avanza (Semi)", type: "select", opts: ["Argentina", "Suiza"]},
    {id: 18, label: "Partido 1ra Semifinal", type: "select", opts: ["Francia vs Belgica", "Francia vs España", "Marruecos vs España", "Marruecos vs Belgica"]},
    {id: 19, label: "Partido 2da Semifinal", type: "select", opts: ["Inglaterra vs Argentina", "Inglaterra vs Suiza", "Noruega vs Argentina", "Noruega vs Suiza"]},
    {id: 20, label: "1er Finalista", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica"]},
    {id: 21, label: "2do Finalista", type: "select", opts: ["Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 22, label: "Partido Final", type: "select", opts: ["Francia vs Noruega", "Francia vs Inglaterra", "Francia vs Argentina", "Francia vs Suiza", "España vs Noruega", "España vs Inglaterra", "España vs Argentina", "España vs Suiza", "Marruecos vs Noruega", "Marruecos vs Inglaterra", "Marruecos vs Argentina", "Marruecos vs Suiza", "Belgica vs Noruega", "Belgica vs Inglaterra", "Belgica vs Argentina", "Belgica vs Suiza"]},
    {id: 23, label: "1er Tercer Lugar", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica"]},
    {id: 24, label: "2do Tercer Lugar", type: "select", opts: ["Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 25, label: "Partido 3er Lugar", type: "select", opts: ["Francia vs Noruega", "Francia vs Inglaterra", "Francia vs Argentina", "Francia vs Suiza", "España vs Noruega", "España vs Inglaterra", "España vs Argentina", "España vs Suiza", "Marruecos vs Noruega", "Marruecos vs Inglaterra", "Marruecos vs Argentina", "Marruecos vs Suiza", "Belgica vs Noruega", "Belgica vs Inglaterra", "Belgica vs Argentina", "Belgica vs Suiza"]},
    {id: 26, label: "Campeón del mundial", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 27, label: "Sub-campeón", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 28, label: "Tercer lugar", type: "select", opts: ["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 29, label: "Máximo goleador", type: "select", opts: ["Lionel Messi", "Mbappe", "Haaland", "Harry Kane", "Dembele", "Oyarzabal", "Otro"]}
];

const container = document.getElementById('form-container');
qList.forEach(q => {
    let html = `<div class="q-box"><label>${q.id}. ${q.label}</label>`;
    if (q.type === 'score') {
        html += `<div class="score-row"><input type="number" id="q${q.id}_h" class="score-input" placeholder="0"><span>-</span><input type="number" id="q${q.id}_a" class="score-input" placeholder="0"></div>`;
    } else {
        html += `<select id="q${q.id}"><option value="">Selecciona...</option>${q.opts.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
    }
    container.innerHTML += html + `</div>`;
});

function showTab(t) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + t).classList.add('active');
    document.getElementById('btn-' + t).classList.add('active');
    if(t === 'tab') renderLeaderboard();
}

function renderLeaderboard() {
    const tbody = document.querySelector('#leaderboard tbody');
    tbody.innerHTML = '';
    baseDeDatos.forEach(u => {
        tbody.innerHTML += `<tr><td>${u.name}</td><td>✅ Recibido</td></tr>`;
    });
}

function enviarValidado() {
    let vals = {};
    for(let q of qList) {
        if(q.type === 'score') {
            let h = document.getElementById('q'+q.id+'_h').value;
            let a = document.getElementById('q'+q.id+'_a').value;
            if(h === "" || a === "") return mostrarError("Completa marcador " + q.id);
            vals['q'+q.id] = h + "-" + a;
        } else {
            let v = document.getElementById('q'+q.id).value;
            if(!v) return mostrarError("Contesta " + q.id);
            vals['q'+q.id] = v;
        }
    }
    
    // VALIDACIONES LÓGICAS ESTRICTAS
    // 1. Que el finalista provenga de semifinales
    if(!vals.q18.includes(vals.q20) && !vals.q19.includes(vals.q20)) return mostrarError("Error: El finalista " + vals.q20 + " no está en las semifinales.");
    
    // 2. Que el campeón y subcampeón sean los finalistas
    if(vals.q26 !== vals.q20 && vals.q26 !== vals.q21) return mostrarError("Error: El Campeón debe ser uno de los finalistas.");
    if(vals.q27 !== vals.q20 && vals.q27 !== vals.q21) return mostrarError("Error: El Sub-campeón debe ser uno de los finalistas.");
    
    // 3. Que el campeón y subcampeón sean distintos
    if(vals.q26 === vals.q27) return mostrarError("Error: El Campeón y Sub-campeón no pueden ser el mismo equipo.");
    
    let name = document.getElementById('username').value || "Anónimo";
    let data = btoa(JSON.stringify({name: name, answers: vals}));
    window.open(`https://api.whatsapp.com/send?phone=5215546879724&text=Mis pronósticos: ${data}`);
}

function mostrarError(msg) {
    const err = document.getElementById('error-msg');
    err.innerText = msg;
    err.style.display = 'block';
    window.scrollTo({top: 0, behavior: 'smooth'});
}
</script>
</body>
</html>
