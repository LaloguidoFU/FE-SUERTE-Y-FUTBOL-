<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Final Mundial</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .q-box { margin-bottom: 15px; padding: 10px; border-bottom: 1px solid #eee; }
        select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { width: 100%; padding: 15px; background: #22c55e; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 Quiniela Final</h2>
    <div id="tabs">
        <button onclick="show('form')">📝 Pronosticar</button>
        <button onclick="show('table')">📊 Tabla</button>
    </div>

    <div id="form-div">
        <div class="q-box">
            <label>Nombre:</label>
            <input type="text" id="username" style="width:100%; padding:8px; margin-top:5px;" placeholder="Tu Nombre">
        </div>
        <div id="questions-container"></div>
        <button onclick="enviar()">Enviar por WhatsApp</button>
    </div>

    <div id="table-div" class="hidden">
        <table id="results-table">
            <thead><tr><th>Participante</th><th>Puntos</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
// Lista de opciones para marcadores
const scoreOpts = Array.from({length: 10}, (_, i) => i);

// Estructura de las 29 preguntas
const qData = [
    {id: 1, label: "Resultado Francia vs Marruecos", opts: ["Francia", "Empate", "Marruecos"]},
    {id: 2, label: "Marcador Francia - Marruecos", isScore: true},
    {id: 3, label: "Mbappe Anotará", opts: ["Si", "No"]},
    {id: 4, label: "Resultado España vs Belgica", opts: ["España", "Empate", "Belgica"]},
    {id: 5, label: "Marcador España - Belgica", isScore: true},
    {id: 6, label: "Lamine Yamal Anotará", opts: ["Si", "No"]},
    {id: 7, label: "Resultado Inglaterra vs Noruega", opts: ["Inglaterra", "Empate", "Noruega"]},
    {id: 8, label: "Marcador Inglaterra - Noruega", isScore: true},
    {id: 9, label: "Harry Kane Anotará", opts: ["Si", "No"]},
    {id: 10, label: "Haland Anotará", opts: ["Si", "No"]},
    {id: 11, label: "Resultado Argentina vs Suiza", opts: ["Argentina", "Empate", "Suiza"]},
    {id: 12, label: "Marcador Argentina - Suiza", isScore: true},
    {id: 13, label: "Messi Anotará", opts: ["Si", "No"]},
    {id: 14, label: "1er equipo que avanza (Semi)", opts: ["Francia", "Marruecos"]},
    {id: 15, label: "2do equipo que avanza (Semi)", opts: ["España", "Belgica"]},
    {id: 16, label: "3er equipo que avanza (Semi)", opts: ["Inglaterra", "Noruega"]},
    {id: 17, label: "4to equipo que avanza (Semi)", opts: ["Argentina", "Suiza"]},
    {id: 18, label: "Partido 1ra Semifinal", opts: ["Francia vs Belgica", "Francia vs España", "Marruecos vs España", "Marruecos vs Belgica"]},
    {id: 19, label: "Partido 2da Semifinal", opts: ["Inglaterra vs Argentina", "Inglaterra vs Suiza", "Noruega vs Argentina", "Noruega vs Suiza"]},
    {id: 20, label: "1er equipo que avanza a la final", opts: ["Francia", "Marruecos", "España", "Belgica"]},
    {id: 21, label: "2do equipo que avanza a la final", opts: ["Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 22, label: "Partido de la final", opts: ["Francia vs Noruega", "Francia vs Inglaterra", "Francia vs Argentina", "Francia vs Suiza", "España vs Noruega", "España vs Inglaterra", "España vs Argentina", "España vs Suiza", "Marruecos vs Noruega", "Marruecos vs Inglaterra", "Marruecos vs Argentina", "Marruecos vs Suiza", "Belgica vs Noruega", "Belgica vs Inglaterra", "Belgica vs Argentina", "Belgica vs Suiza"]},
    {id: 23, label: "1er equipo al partido de tercer lugar", opts: ["Francia", "Marruecos", "España", "Belgica"]},
    {id: 24, label: "2do equipo al partido de tercer lugar", opts: ["Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 25, label: "Partido de tercer lugar", opts: ["Francia vs Noruega", "Francia vs Inglaterra", "Francia vs Argentina", "Francia vs Suiza", "España vs Noruega", "España vs Inglaterra", "España vs Argentina", "España vs Suiza", "Marruecos vs Noruega", "Marruecos vs Inglaterra", "Marruecos vs Argentina", "Marruecos vs Suiza", "Belgica vs Noruega", "Belgica vs Inglaterra", "Belgica vs Argentina", "Belgica vs Suiza"]},
    {id: 26, label: "Campeón del mundial", opts: ["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 27, label: "Sub-campeón del mundial", opts: ["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 28, label: "Tercer lugar del mundial", opts: ["Francia", "Marruecos", "España", "Belgica", "Inglaterra", "Noruega", "Argentina", "Suiza"]},
    {id: 29, label: "Máximo goleador", opts: ["Lionel Messi", "Mbappe", "Haaland", "Harry Kane", "Dembele", "Oyarzabal", "Otro"]}
];

// Generar Formulario
const container = document.getElementById('questions-container');
qData.forEach(q => {
    let html = `<div class="q-box"><label>${q.id}. ${q.label}</label><br>`;
    if(q.isScore) {
        html += `<select id="q${q.id}_h">${scoreOpts.map(s => `<option value="${s}">${s}</option>`).join('')}</select> - 
                 <select id="q${q.id}_a">${scoreOpts.map(s => `<option value="${s}">${s}</option>`).join('')}</select>`;
    } else {
        html += `<select id="q${q.id}"><option value="">Selecciona...</option>${q.opts.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
    }
    container.innerHTML += html + `</div>`;
});

function show(tab) {
    document.getElementById('form-div').classList.toggle('hidden', tab !== 'form');
    document.getElementById('table-div').classList.toggle('hidden', tab !== 'table');
}

function enviar() {
    let data = { name: document.getElementById('username').value, answers: {} };
    // Validación: que no dejen nada en blanco
    let selects = document.querySelectorAll('select');
    for(let s of selects) {
        if(s.value === "") return alert("Faltan preguntas por contestar");
        data.answers[s.id] = s.value;
    }
    
    // Aquí puedes añadir tu lógica de validación de cascada si lo deseas:
    // if(data.answers.q14 !== ...) { alert("Incongruencia"); return; }

    let str = btoa(JSON.stringify(data));
    window.open(`https://api.whatsapp.com/send?phone=5215546879724&text=Quiniela: ${str}`);
}
</script>
</body>
</html>
