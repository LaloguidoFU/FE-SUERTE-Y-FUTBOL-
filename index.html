<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiniela Pro - Cuartos</title>
    <style>
        :root { --primary: #1e3a8a; --primary-light: #3b82f6; --bg: #f8fafc; --green: #22c55e; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); padding: 10px; font-size: 16px; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; padding: 15px; background: var(--primary); color: white; border-radius: 12px; }
        
        /* Tabs mejoradas para móvil */
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #cbd5e1; cursor: pointer; font-weight: bold; font-size: 14px; }
        .tab-btn.active { background: var(--primary-light); color: white; }

        .panel { display: none; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .panel.active { display: block; }

        /* Tabla responsiva */
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; font-size: 13px; border-collapse: collapse; margin-top: 10px; min-width: 400px; }
        th, td { padding: 10px 5px; text-align: center; border-bottom: 1px solid var(--border); }
        .hit { background-color: #dcfce7; color: #166534; font-weight: bold; }

        /* Partidos */
        .match-card { padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; background: #fff; }
        .teams-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; font-size: 15px; }
        .controls-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .score-input { width: 50px; padding: 10px; text-align: center; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        select { padding: 10px; border-radius: 6px; font-size: 14px; border: 1px solid #ccc; }
        
        .submit-btn { width: 100%; padding: 15px; background: var(--green); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>🏆 Quiniela: Cuartos</h1></header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(this, 'tabla')">📊 Tabla</button>
        <button class="tab-btn" onclick="switchTab(this, 'registro')">📝 Registro</button>
        <button class="tab-btn" onclick="switchTab(this, 'admin')">⚙️ Admin</button>
    </div>

    <div id="panel-tabla" class="panel active">
        <div class="table-container">
            <table id="leaderboard">
                <thead>
                    <tr><th>Participante</th><th>Total</th><th>Pase<br>(1pt)</th><th>Rdo<br>(2pt)</th><th>Marc<br>(3pt)</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="panel-registro" class="panel">
        <input type="text" id="player-name" placeholder="Tu nombre..." style="width:100%; padding:12px; margin-bottom:15px; font-size:16px; border:1px solid #ccc; border-radius:8px;">
        <div id="matches-form-container"></div>
        <button class="submit-btn" onclick="validateAndSave()">Enviar WhatsApp</button>
    </div>

    <div id="panel-admin" class="panel">
        <input type="password" id="admin-pass" placeholder="Contraseña..." style="width:100%; padding:10px; margin-bottom:10px;">
        <button onclick="verifyAdmin()" style="width:100%; padding:10px;">Verificar</button>
        <div id="admin-content" style="display:none; margin-top:15px;">
            <div id="admin-matches-container"></div>
            <button class="submit-btn" onclick="saveOfficialResults()">Guardar Resultados</button>
        </div>
    </div>
</div>

<script>
    const matches = [
        {id:1, home:"Paraguay", away:"Francia"},
        {id:2, home:"Canadá", away:"Marruecos"},
        {id:3, home:"Brasil", away:"Noruega"},
        {id:4, home:"México", away:"Inglaterra"},
        {id:5, home:"Portugal", away:"España"},
        {id:6, home:"Estados Unidos", away:"Bélgica"},
        {id:7, home:"Argentina", away:"Egipto"},
        {id:8, home:"Suiza", away:"Colombia"}
    ];

    let participants = JSON.parse(localStorage.getItem('q_cuartos_players')) || [];
    let officialResults = JSON.parse(localStorage.getItem('q_cuartos_official')) || {};

    window.onload = () => { initForms(); renderLeaderboard(); };

    function initForms() {
        let regHTML = '', admHTML = '';
        matches.forEach(m => {
            regHTML += `
                <div class="match-card">
                    <div class="teams-row"><span>${m.home}</span> vs <span>${m.away}</span></div>
                    <div class="controls-row">
                        <input type="number" class="score-input" id="home-${m.id}" placeholder="0" min="0">
                        <input type="number" class="score-input" id="away-${m.id}" placeholder="0" min="0">
                        <select id="rdo-${m.id}"><option value="L">Local</option><option value="E">Empate</option><option value="V">Visita</option></select>
                        <select id="pass-${m.id}"><option value="${m.home}">${m.home}</option><option value="${m.away}">${m.away}</option></select>
                    </div>
                </div>`;
            admHTML += `<div class="match-card">${m.home} vs ${m.away} <br> <input type="number" id="adm-home-${m.id}" style="width:40px;"> - <input type="number" id="adm-away-${m.id}" style="width:40px;"> <select id="adm-rdo-${m.id}"><option value="L">L</option><option value="E">E</option><option value="V">V</option></select> <select id="adm-pass-${m.id}"><option value="${m.home}">${m.home}</option><option value="${m.away}">${m.away}</option></select></div>`;
        });
        document.getElementById('matches-form-container').innerHTML = regHTML;
        document.getElementById('admin-matches-container').innerHTML = admHTML;
    }

  function validateAndSave() {
        for (let m of matches) {
            let hInput = document.getElementById('home-' + m.id).value;
            let aInput = document.getElementById('away-' + m.id).value;
            let res = document.getElementById('rdo-' + m.id).value;
            let adv = document.getElementById('pass-' + m.id).value;

            // 1. Validar que no estén vacíos
            if (hInput === "" || aInput === "") {
                return alert(`¡Error en ${m.home} vs ${m.away}! Debes llenar ambos marcadores.`);
            }

            let hScore = parseInt(hInput);
            let aScore = parseInt(aInput);

            // 2. Validar que sean números positivos
            if (isNaN(hScore) || isNaN(aScore) || hScore < 0 || aScore < 0) {
                return alert(`¡Error en ${m.home} vs ${m.away}! Debes ingresar números positivos.`);
            }

            // 3. Validar congruencia Marcador vs Resultado (L/E/V)
            if (res === 'L' && hScore <= aScore) return alert(`¡Incongruencia en ${m.home} vs ${m.away}! Elegiste Local, pero el marcador no refleja victoria local.`);
            if (res === 'V' && aScore <= hScore) return alert(`¡Incongruencia en ${m.home} vs ${m.away}! Elegiste Visita, pero el marcador no refleja victoria visitante.`);
            if (res === 'E' && hScore !== aScore) return alert(`¡Incongruencia en ${m.home} vs ${m.away}! Elegiste Empate, pero el marcador no es igual.`);

            // 4. Validar consistencia con el equipo que avanza
            if (res === 'L' && adv !== m.home) return alert(`¡Error! Elegiste Local (L) pero ${adv} no es el local.`);
            if (res === 'V' && adv !== m.away) return alert(`¡Error! Elegiste Visita (V) pero ${adv} no es el visitante.`);
        }
        savePrediction();
    }
    function calculateScore(p) {
        let scores = { total: 0, advance: 0, outcome: 0, scoreline: 0 };
        matches.forEach(m => {
            let o = officialResults[m.id];
            let pred = p.predictions[m.id];
            if (!o || !pred) return;
            if(pred.advance === o.advance) scores.advance += 1;
            if(pred.result === o.result) scores.outcome += 2;
            if(pred.homeScore === o.homeScore && pred.awayScore === o.awayScore) scores.scoreline += 3;
        });
        scores.total = scores.advance + scores.outcome + scores.scoreline;
        return scores;
    }

    function renderLeaderboard() {
        const tbody = document.querySelector('#leaderboard tbody');
        tbody.innerHTML = '';
        participants.forEach(p => {
            let s = calculateScore(p);
            tbody.innerHTML += `<tr><td>${p.name}</td><td><b>${s.total}</b></td><td class="${s.advance > 0 ? 'hit' : ''}">${s.advance}</td><td class="${s.outcome > 0 ? 'hit' : ''}">${s.outcome}</td><td class="${s.scoreline > 0 ? 'hit' : ''}">${s.scoreline}</td></tr>`;
        });
    }

    function savePrediction() {
        const name = document.getElementById('player-name').value;
        if(!name) return alert('Pon tu nombre');
        let preds = {};
        matches.forEach(m => {
            preds[m.id] = {
                homeScore: parseInt(document.getElementById('home-'+m.id).value),
                awayScore: parseInt(document.getElementById('away-'+m.id).value),
                result: document.getElementById('rdo-'+m.id).value,
                advance: document.getElementById('pass-'+m.id).value
            };
        });
        let data = btoa(JSON.stringify({name, predictions: preds}));
        window.open(`https://api.whatsapp.com/send?phone=5215546879724&text=Mi código es: ${data}`);
    }

    function saveOfficialResults() {
        matches.forEach(m => {
            officialResults[m.id] = {
                homeScore: parseInt(document.getElementById('adm-home-'+m.id).value) || 0,
                awayScore: parseInt(document.getElementById('adm-away-'+m.id).value) || 0,
                result: document.getElementById('adm-rdo-'+m.id).value,
                advance: document.getElementById('adm-pass-'+m.id).value
            };
        });
        localStorage.setItem('q_cuartos_official', JSON.stringify(officialResults));
        renderLeaderboard();
        alert('Resultados guardados');
    }

    function switchTab(btn, t) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${t}`).classList.add('active');
    }
    
    function verifyAdmin() { if(document.getElementById('admin-pass').value === "1234") document.getElementById('admin-content').style.display = 'block'; }
</script>
</body>
</html>
