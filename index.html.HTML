<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Mundialista 2026</title>
    <style>
        :root {
            --primary: #1e3d59;
            --secondary: #17b978;
            --bg: #f5f7fa;
            --text: #333333;
            --white: #ffffff;
            --accent-local: #1e3d59;
            --accent-visita: #e056fd;
            --accent-empate: #f0932b;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary), #112233);
            color: var(--white);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { margin: 0; font-size: 2rem; }
        p { margin: 5px 0 0; opacity: 0.9; }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            max-width: 100%;
            margin: 0 auto;
        }

        @media (min-width: 1000px) {
            .container { grid-template-columns: 380px 1fr; }
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.3rem;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            color: var(--primary);
        }

        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--primary);
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table th, .ranking-table td {
            padding: 12px 10px;
            text-align: left;
        }

        .ranking-table tr { border-bottom: 1px solid var(--bg); }
        .ranking-table tr:last-child { border: none; }

        .badge {
            background: var(--secondary);
            color: var(--white);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            max-height: 650px;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .matrix-table th {
            background-color: var(--primary);
            color: var(--white);
            padding: 12px;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .matrix-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            text-align: center;
        }
        
        .matrix-table td:first-child {
            text-align: left;
            font-weight: bold;
            position: sticky;
            left: 0;
            background-color: var(--white);
            z-index: 5;
            border-right: 2px solid #cbd5e1;
        }

        .matrix-table tr:hover td { background-color: #f8fafc; }

        .local { color: var(--accent-local); font-weight: bold; }
        .visita { color: var(--accent-visita); font-weight: bold; }
        .empate { color: var(--accent-empate); font-weight: bold; }
        
        .real-row td {
            background-color: #e8f5e9 !important;
            font-weight: bold;
            color: #1b5e20;
        }
        
        .real-row td:first-child {
            background-color: #e8f5e9 !important;
            position: sticky;
            left: 0;
            z-index: 6;
        }

        /* selectores interactivos en la fila real */
        .select-resultado {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #1b5e20;
            background-color: #ffffff;
            font-weight: bold;
            color: #1b5e20;
            cursor: pointer;
        }

        .hit { background-color: #d1fae5 !important; color: #065f46; font-weight: bold; }
        .miss { background-color: #fee2e2 !important; color: #991b1b; }
    </style>
</head>

        function initQuiniela() {
            const headerRow = document.getElementById("matrix-header");
            
            // 1. Agregar cabeceras estáticas de partidos (solo se hace una vez)
            partidos.forEach(partido => {
                const th = document.createElement("th");
                th.innerText = partido;
                headerRow.appendChild(th);
            });

            // 2. Construir la estructura base de la fila de Resultados Reales con selectores HTML
            const matrixBody = document.getElementById("matrix-body");
            const realRow = document.createElement("tr");
            realRow.className = "real-row";
            realRow.innerHTML = "<td>RESULTADOS REALES</td>";
            
            resultadosReales.forEach((res, index) => {
                const td = document.createElement("td");
                // Le metemos un selector de opciones que llama a recalcular todo cuando cambia ('onchange')
                td.innerHTML = `
                    <select class="select-resultado" data-index="${index}" onchange="procesarCambioResultado(this)">
                        <option value="-">-</option>
                        <option value="Local">Local</option>
                        <option value="Empate">Empate</option>
                        <option value="Visita">Visita</option>
                    </select>
                `;
                realRow.appendChild(td);
            });
            matrixBody.appendChild(realRow);

            // 3. Crear las filas de los participantes (vacías de clases al inicio)
            participantes.forEach(p => {
                const row = document.createElement("tr");
                row.setAttribute("data-name", p.nombre.trim().toLowerCase());
                row.id = `fila-${p.nombre.replace(/\s+/g, '-')}`;
                
                let html = `<td>${p.nombre.trim()}</td>`;
                p.pronosticos.forEach((pronostico) => {
                    html += `<td>${pronostico}</td>`;
                });
                row.innerHTML = html;
                matrixBody.appendChild(row);
            });

            // 4. Correr el motor de cálculo por primera vez
            recalcularTodo();
        }

        // Esta función se activa en automático cada vez que cambias un menú de la fila verde
        function procesarCambioResultado(selector) {
            const index = selector.getAttribute("data-index");
            resultadosReales[index] = selector.value;
            recalcularTodo();
        }

        function recalcularTodo() {
            // 1. Resetear puntos de todos antes de volver a contar
            participantes.forEach(p => p.puntosTotales = 0);

            // 2. Escanear columna por columna (partido por partido)
            for (let i = 0; i < partidos.length; i++) {
                const resultadoActual = resultadosReales[i];

                participantes.forEach(p => {
                    const pronostico = p.pronosticos[i];
                    
                    // Si el partido ya tiene ganador cargado, revisamos aciertos
                    if (resultadoActual !== "-") {
                        if (pronostico.toLowerCase() === resultadoActual.toLowerCase()) {
                            p.puntosTotales += 3;
                        }
                    }
                });
            }

            // 3. Pintar de forma dinámica las celdas en base al nuevo estado
            participantes.forEach(p => {
                const filaHtml = document.getElementById(`fila-${p.nombre.replace(/\s+/g, '-')}`);
                if (!filaHtml) return;

                const celdas = filaHtml.getElementsByTagName("td");

                p.pronosticos.forEach((pronostico, i) => {
                    const celda = celdas[i + 1]; // i+1 porque la primera celda es el nombre del jugador
                    const resultadoActual = resultadosReales[i];

                    // Limpiamos estilos viejos
                    celda.className = "";

                    if (resultadoActual === "-") {
                        // Si no se ha jugado, dejamos el color normal del texto (Local, Empate o Visita)
                        celda.className = pronostico.toLowerCase();
                    } else {
                        // Si ya hay resultado, inyectamos .hit (verde) o .miss (rojo)
                        if (pronostico.toLowerCase() === resultadoActual.toLowerCase()) {
                            celda.className = pronostico.toLowerCase() + " hit";
                        } else {
                            celda.className = pronostico.toLowerCase() + " miss";
                        }
                    }
                });
            });

            // 4. Actualizar visualmente la tabla de posiciones (Ranking)
            actualizarRanking();
        }

        function actualizarRanking() {
            const rankingBody = document.getElementById("ranking-body");
            if (!rankingBody) return;
            rankingBody.innerHTML = "";

            // Clonamos y ordenamos de mayor a menor puntaje
            const sorted = [...participantes].sort((a, b) => b.puntosTotales - a.puntosTotales);

            sorted.forEach((p, index) => {
                const tr = document.createElement("tr");
                let posDisplay = index + 1;
                
                tr.innerHTML = `
                    <td style="font-weight: bold; font-size: 1.1rem;">${posDisplay}</td>
                    <td>${p.nombre.trim()}</td>
                    <td style="text-align: right;"><span class="badge">${p.puntosTotales} pts</span></td>
                `;
                rankingBody.appendChild(tr);
            });
        }

        function filterMatrix() {
            const input = document.getElementById("search").value.toLowerCase().trim();
            const rows = document.querySelectorAll("#matrix-body tr");
            
            rows.forEach(row => {
                if(row.classList.contains("real-row")) return;
                
                const name = row.getAttribute("data-name");
                if (name && name.includes(input)) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initQuiniela);
        } else {
            initQuiniela();
        }
    </script>
</body>
</html>
